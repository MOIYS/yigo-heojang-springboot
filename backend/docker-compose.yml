# 로컬 통합 실행용: Spring Boot 실행 JAR + MySQL 8.0 + Redis + 챗봇(Python)
# 선행: JAR를 먼저 빌드해야 한다  →  ./mvnw clean package
#       (target/yigo-heojang-backend.jar 생성)
# MYSQL_ROOT_PASSWORD, REDIS_PASSWORD와 두 JWT Secret은 같은 폴더의 .env에서 읽는다.
# 공유 가능한 키 목록은 .env.example에 있으며 실제 .env는 커밋하지 않는다.
#
# 주의: docker로 실행할 땐 db.properties의 주소를 컨테이너 이름으로 바꾼 뒤 JAR를 다시 빌드한다
#       (db.properties가 JAR 안에 포함되기 때문).
#         db.url        localhost:3306      → mysql:3306
#         chatbot.base-url  127.0.0.1:8000  → http://chatbot:8000
#       컨테이너 안에서 localhost는 "그 컨테이너 자신"이라 옆 컨테이너에 닿지 않는다.
#
# 브랜치를 바꾼 뒤에는 clean 부터 한다. target/에 남은 이전 브랜치의 매퍼 XML이
# 없는 클래스를 가리키면 Spring 기동이 통째로 실패한다(모든 요청 404).

services:
  mysql:
    image: mysql:8.0
    container_name: yigo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: wallet # 초기 DB 자동 생성 (스키마 SQL은 다음 단계)
      TZ: Asia/Seoul
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: yigo-redis
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data

  backend:
    image: eclipse-temurin:21-jre
    container_name: yigo-backend
    working_dir: /app
    command: ["java", "-jar", "/app/yigo-heojang-backend.jar"]
    depends_on:
      - mysql
      - redis
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?JWT_ACCESS_TOKEN_SECRET is required}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?JWT_REFRESH_TOKEN_SECRET is required}
    volumes:
      - ./target/yigo-heojang-backend.jar:/app/yigo-heojang-backend.jar:ro

  # 챗봇 서버. 가져다 쓸 이미지가 없어 ai-server/Dockerfile 로 직접 만든다.
  #
  # ports 를 쓰지 않는 것이 핵심이다. 이 서버는 토큰을 검증하지 않는다 —
  # Spring Boot가 이미 검증한 요청만 온다는 전제 위에 서 있다. 밖에서 직접 부를 수 있으면
  # 그 전제가 깨지므로, 같은 네트워크의 톰캣만 http://chatbot:8000 으로 닿게 둔다.
  chatbot:
    build: ../ai-server
    container_name: yigo-chatbot
    depends_on:
      - mysql
    # API 키는 각자 것을 쓴다. 저장소에 올라가지 않는 파일이다.
    env_file:
      - ../ai-server/.env
    # 주소는 컨테이너 이름으로 덮어쓴다. .env 의 값(localhost)은 컨테이너 밖에서 돌릴 때의 것이라
    # 여기서 이긴다 — 환경변수가 이미 있으면 .env 가 덮어쓰지 않는다.
    environment:
      DB_HOST: mysql
      BACKEND_BASE_URL: http://backend:8080
      CHATBOT_HOST: 0.0.0.0

volumes:
  mysql-data:
  redis-data:
