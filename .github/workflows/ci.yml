name: CI

# push(develop·main)와 모든 PR에서 모노레포 전체를 검사한다.
# 목적: 회귀 자동 감지 + PR 본문의 "다른 파트 영향 없음"을 기계로 뒷받침.
#
# 파트별로 job을 나눈 이유는 두 가지다.
#   ① 병렬로 돌아 전체 시간이 느린 쪽 하나만큼만 걸린다
#   ② 실패한 job 이름만 봐도 어느 파트가 깨졌는지 바로 안다
#
# 변경 경로로 job을 건너뛰게(paths 필터) 하지 않는다. 필수 체크로 지정된 job이 skip되면
# "통과"가 아니라 "미실행"으로 남아 머지 판정이 애매해지기 때문이다. 전부 항상 돌린다.
#
# ⚠️ job을 추가하면 GitHub 저장소 설정에서 필수 체크 목록에도 추가해야 머지를 막는다
#    (Settings → Rules → protect-develop → Require status checks). 안 하면 빨간불이어도 머지된다.
on:
  push:
    branches: [develop, main]
  pull_request:

# 아래 값은 격리된 CI 컨테이너에서만 사용하고 실행 종료 후 폐기하는 일회용 설정이다.
# 운영·배포 환경처럼 실제 인증정보가 필요한 경우 값을 직접 작성하지 말고
# ${{ secrets.SECRET_NAME }} 형식의 GitHub Secrets 참조를 사용한다.
env:
  CI_DB_HOST: 127.0.0.1
  CI_DB_PORT: '3306'
  CI_DB_NAME: wallet
  CI_DB_USER: root
  CI_DB_PASSWORD: ci-only-mysql-password

  CI_REDIS_HOST: 127.0.0.1
  CI_REDIS_PORT: '6379'
  CI_REDIS_PASSWORD: ci-only-redis-password

  CI_MAIL_HOST: localhost
  CI_MAIL_PORT: '2525'
  CI_MAIL_USERNAME: ci-only-mail-user
  CI_MAIL_PASSWORD: ci-only-mail-password
  CI_MAIL_FROM: ci@example.com

  # 실제 서명용 Secret이 아닌 테스트 실행마다 폐기되는 CI 전용 JWT 값이다.
  JWT_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-at-least-32-bytes
  JWT_REFRESH_TOKEN_SECRET: ci-only-refresh-token-secret-at-least-32-bytes

jobs:
  # 이름을 바꾸지 말 것 — develop 보호 규칙이 이 이름을 필수 체크로 지정하고 있다.
  backend-test:
    runs-on: ubuntu-latest

    # 통합 테스트가 실 MySQL을 요구한다(H2 배제). 로컬 docker-compose의 yigo-mysql과 같은 이미지.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.CI_DB_NAME }}
        ports:
          - 3306:3306
        # 헬스체크가 통과해야 이후 스텝이 시작된다 → 스키마 적재가 기동 전에 도는 레이스 방지.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # GitHub Actions의 service 선언은 redis-server 실행 인자를 지정할 수 없다.
      # 애플리케이션의 redis.password와 맞도록 requirepass를 직접 설정해 실행한다.
      - name: Start Redis
        run: |
          docker run --detach --name redis-ci --publish "$CI_REDIS_PORT:$CI_REDIS_PORT" \
            redis:7.2 redis-server --requirepass "$CI_REDIS_PASSWORD"

          for attempt in {1..10}; do
            if docker exec redis-ci redis-cli -a "$CI_REDIS_PASSWORD" ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done

          docker logs redis-ci
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 시드 파일이 순서대로 적재되는지는 따로 검사한다. 목적이 다르다 —
      # 애플리케이션 테스트는 빈 DB에 Flyway V1만 적용하고, 여기는 "시드가 깨지지 않았나"를 본다.
      # 별도 DB에 넣는 이유: 테스트 DB에 시드를 부으면 테스트가 그걸 쓰게 되어 위 원칙이 무너진다.
      # 순서 의존도 함께 검증된다(91은 data.sql의 카테고리가, 92는 91의 카드·혜택이 먼저 있어야 한다).
      - name: Verify seed files load in order
        run: |
          mysql -h "$CI_DB_HOST" -P "$CI_DB_PORT" -u"$CI_DB_USER" -p"$CI_DB_PASSWORD" \
            -e "CREATE DATABASE wallet_seed_check CHARACTER SET utf8mb4"
          for f in src/main/resources/db/migration/V1__init_schema.sql db/data.sql db/91_seed_card_benefit.sql db/92_seed_user_data.sql; do
            echo "적재: $f"
            mysql -h "$CI_DB_HOST" -P "$CI_DB_PORT" -u"$CI_DB_USER" -p"$CI_DB_PASSWORD" --default-character-set=utf8mb4 \
              wallet_seed_check < "$f"
          done
          mysql -h "$CI_DB_HOST" -P "$CI_DB_PORT" -u"$CI_DB_USER" -p"$CI_DB_PASSWORD" \
            -e "DROP DATABASE wallet_seed_check"

      # db.properties는 gitignore라 저장소에 없다(개인 접속값). CI 접속값으로 새로 만든다.
      # allowPublicKeyRetrieval=true: 새 MySQL의 caching_sha2 최초 인증이 평문 TCP에서 막히지 않게.
      - name: Generate db.properties for CI
        run: |
          cat > src/main/resources/db.properties <<EOF
          db.driver=com.mysql.cj.jdbc.Driver
          db.url=jdbc:mysql://$CI_DB_HOST:$CI_DB_PORT/$CI_DB_NAME?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
          db.username=$CI_DB_USER
          db.password=$CI_DB_PASSWORD

          mail.host=$CI_MAIL_HOST
          mail.port=$CI_MAIL_PORT
          mail.username=$CI_MAIL_USERNAME
          mail.password=$CI_MAIL_PASSWORD
          mail.from=$CI_MAIL_FROM
          mail.smtp.auth=false
          mail.smtp.starttls.enable=false
          mail.smtp.connectiontimeout=1000
          mail.smtp.timeout=1000
          mail.smtp.writetimeout=1000
          mail.debug=false

          chatbot.base-url=http://127.0.0.1:8000
          EOF

      # redis.properties도 gitignore라 저장소에 없다. 알림 특성 통합 테스트는 위 컨테이너의
      # 실제 Redis를 사용해 분산 락·캐시 무효화·캐시 미스 복구를 검증한다.
      - name: Generate redis.properties for CI
        run: |
          cat > src/main/resources/redis.properties <<EOF
          redis.host=$CI_REDIS_HOST
          redis.port=$CI_REDIS_PORT
          redis.password=$CI_REDIS_PASSWORD
          redis.timeout-millis=2000

          redis.pool.max-total=16
          redis.pool.max-idle=8
          redis.pool.min-idle=2

          redis.unread-count.ttl-seconds=3600
          redis.lock.ttl-seconds=600
          EOF

      - name: Print toolchain versions
        run: |
          java -version
          ./mvnw -v

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: error

  # 챗봇 서버(Python)는 pytest로 검사한다.
  #
  # MySQL을 띄우고 시드까지 넣는 이유는, 테스트 대부분이 DB 연결이 없으면 스스로 건너뛰기
  # 때문이다(별칭 조회가 SQL 안에 있어 가짜로 바꾸면 정작 확인하려는 것을 못 본다).
  # DB 없이 돌리면 초록불이 뜨지만 실제로 검사된 것은 몇 건뿐이다.
  #
  # LLM은 부르지 않는다 — LLM_PROVIDER 기본값이 stub이라 API 키 없이 전 구간이 돈다.
  chatbot-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.CI_DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-server/chatbot/requirements.txt

      - name: Install dependencies
        working-directory: ai-server
        run: pip install -r chatbot/requirements.txt

      # 별칭·가맹점·카드 조회가 시드 데이터를 읽는다. 적재 순서를 지켜야 한다.
      - name: Load schema and seed into MySQL
        working-directory: backend
        run: |
          for f in src/main/resources/db/migration/V1__init_schema.sql db/data.sql db/91_seed_card_benefit.sql db/92_seed_user_data.sql; do
            mysql -h "$CI_DB_HOST" -P "$CI_DB_PORT" -u"$CI_DB_USER" -p"$CI_DB_PASSWORD" --default-character-set=utf8mb4 "$CI_DB_NAME" < "$f"
          done

      # .env는 gitignore라 저장소에 없다(개인 접속값·API 키). CI 접속값으로 새로 만든다.
      - name: Generate .env for CI
        working-directory: ai-server
        run: |
          cat > .env <<EOF
          DB_HOST=$CI_DB_HOST
          DB_PORT=$CI_DB_PORT
          DB_NAME=$CI_DB_NAME
          DB_USER=$CI_DB_USER
          DB_PASSWORD=$CI_DB_PASSWORD
          LLM_PROVIDER=stub
          BACKEND_BASE_URL=http://127.0.0.1:8080
          EOF

      - name: Run tests
        working-directory: ai-server
        run: python -m pytest chatbot/tests -q

  # 프론트엔드는 아직 테스트 스크립트가 없어 빌드로 검사한다.
  # 빌드만으로도 문법 오류·중복 선언·닫히지 않은 태그·없는 모듈 import가 전부 걸린다
  # (실제로 이런 사고가 있었다: 중복 import 한 줄 때문에 앱 첫 화면이 백지가 됐고,
  #  backend만 검사하던 CI는 초록불이었다).
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite 8은 Node 20.19+ 또는 22.12+를 요구한다. 로컬 개발 환경과 맞춰 24로 고정한다.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm install이 아니라 npm ci — package-lock.json을 그대로 재현한다.
      # 사람마다 다른 버전이 깔려 "내 로컬에선 되는데"가 생기는 것을 막고,
      # lock과 package.json이 어긋나면 여기서 바로 실패한다.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
