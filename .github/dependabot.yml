version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    open-pull-requests-limit: 0   # Boot 4.1 완료 전까지 일시 중단
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Spring Boot BOM 마이그레이션 전 Spring 의존성 간 충돌 방지
      - dependency-name: "org.springframework*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 0   # Boot 4.1 완료 전까지 일시 중단
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/api-test"
    open-pull-requests-limit: 0   # Boot 4.1 완료 전까지 일시 중단
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/ai-server/chatbot"
    open-pull-requests-limit: 0   # Boot 4.1 완료 전까지 일시 중단
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0   # Boot 4.1 완료 전까지 일시 중단
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"